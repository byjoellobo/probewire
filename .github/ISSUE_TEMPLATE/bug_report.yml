name: Bug report
description: Something in Probewire does not work as expected.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues first.
        For security problems, do not open an issue: see the security policy instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Connected a ...
        2. Captured at ...
        3. Expected ..., but ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connecting to an analyzer
        - Capturing
        - Waveform view or measurements
        - Decoders
        - .sr files
        - Library and storage
        - Install, offline or updates
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Probewire version
      description: Shown in the release you downloaded, or "hosted" if you used byjoellobo.github.io/probewire.
      placeholder: 0.1.0 or hosted
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: Chrome 150 on Windows 11, or Chrome 148 on Android 17 (Pixel 9)
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Analyzer and firmware (if any)
      placeholder: gusmanb V6_0 on Pico 2, sigrok-pico on Pico, or none (demo)
  - type: textarea
    id: messages
    attributes:
      label: Error messages
      description: Any message shown in the app, and errors from the browser console if you can open it.
      render: text
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Attach a .sr file or screenshot that shows the problem, if relevant. You can drag files into this box.
